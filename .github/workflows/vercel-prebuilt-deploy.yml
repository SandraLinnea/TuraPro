name: Deploy Blazor to Vercel

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --scope=${{ env.VERCEL_ORG_ID }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Restore
        run: dotnet restore TuraPro/TuraPro.csproj

      - name: Publish Blazor app
        run: dotnet publish TuraPro/TuraPro.csproj -c Release -o publish

      - name: Create Vercel output
        run: |
          mkdir -p .vercel/output/static
          cp -r publish/wwwroot/. .vercel/output/static/
          cat > .vercel/output/config.json <<'EOF'
          {
            "version": 3,
            "routes": [
              { "handle": "filesystem" },
              { "src": "/(.*)", "dest": "/index.html" }
            ]
          }
          EOF

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --scope=${{ env.VERCEL_ORG_ID }} --token=${{ secrets.VERCEL_TOKEN }}
